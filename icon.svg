<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="1" stop-color="#05050d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="url(#halo)"/>
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="48" fill="none" stroke="url(#ring)" stroke-width="20"/>
  </g>
  <circle cx="256" cy="256" r="84" fill="#000" stroke="#ffb35c" stroke-opacity="0.8" stroke-width="3"/>
  <g transform="rotate(-18 256 256)" clip-path="url(#front)">
    <ellipse cx="256" cy="256" rx="170" ry="48" fill="none" stroke="url(#ring)" stroke-width="20"/>
  </g>
</svg>
